# =============================================================
# pytest 配置
# 用法：python -m pytest tests/ -v
#       python -m pytest tests/test_metrics/ -v
# 规范依据：docs/dev-conventions.md 4.4 节
# =============================================================
[pytest]
# 把项目根加进 sys.path，否则 tests/ 下无法 `from models.eval.metrics import ...`
# （tests/ 各子目录没有 __init__.py，pytest 默认只会把测试文件所在目录入路径）
pythonpath = .

testpaths = tests
python_files = test_*.py
python_functions = test_*

# 遇到 assert 失败时打印完整差异，指标对拍需要看到小数位
addopts = -v --tb=short --strict-markers
