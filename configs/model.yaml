# =============================================================
# 模型与训练配置 —— configs/model.yaml
# 用法：python scripts/train.py --config configs/model.yaml
# 超参以 configs/base.yaml 的 model 段为基线，此处可覆盖
# ⚠️ 改动任何超参后必须重跑受影响实验，详见 docs/dev-conventions.md
# =============================================================

# 训练规模档位（定义见 configs/scale.yaml）。命令行 --scale 优先级高于此处默认值。
# 档位只决定 user_ratio / seeds / max_epochs / eval_every_n_epochs / eval_user_ratio；
# 模型结构与训练超参（hidden_size、batch_size 等）【不随档位变化】，
# 这样小档选出的超参才能直接拿到大档使用。
scale: dev

experiment_name: multi_interest_content_v1

model:
  arch: sasrec                  # 默认基座；M2.5 多兴趣用 --model multi_interest 覆盖，
                                # 或改此字段。E2 消融的两个组就由这个开关切换。
                                # 两者共用本段其余全部基座超参（结构上保证可比）
  name: MultiInterestSASRec
  use_multi_interest: true       # M1 多兴趣胶囊
  use_content_fusion: true       # M2 内容融合
  max_seq_len: 50
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  num_interests: 4               # K=4（M2.5 胶囊数；HPO 网格 {2,4,6,8}）
  routing_iters: 3               # MIND 动态路由迭代次数
  share_item_emb: true           # 胶囊与基座共享物品嵌入
                                # ⚠️ 此前误写为 shared_item_emb，会被 from_dict
                                # 静默忽略（默认值恰好也是 true，未造成事故）；
                                # 2026-09-12 修正键名。

content_fusion:
  candidate_side: true           # 候选侧：内容向量拼进物品表示、端到端训练
                                 # ✅ M2.6b 已实现于 models/content_encoder/model.py；
                                 #    训练入口 `python scripts/train.py --content-fusion`
                                 #    （或 --no-content-fusion 关闭）。
                                 #    新增参数（H=64, D=512）：add 32,832 / concat 36,928；
                                 #    内容矩阵是固定 buffer（不可学）
  mode: add                      # ★ 默认口径 = add（零初始化残差 `item_emb + proj(content)`）。
                                 #    训练起点逐位等价纯行为基线 ⇒ 指标差异可完全归因于内容。
                                 #    依据 M2.6b 实测（debug 档 8 epoch、seed 42、同一评估子集）：
                                 #      concat 的 Linear 会自由重学整个物品表示空间
                                 #      （训练后融合表与原 item_emb 余弦仅 0.0097），
                                 #      SASRec 上整模型 −1.1pp；add 是唯一在 SASRec 与多兴趣
                                 #      两种架构上都跑正的口径（+0.0024 / +0.0093 ndcg@10）。
                                 #    concat 保留为 E2 对照臂（显式写 content_mode: concat）。
                                 #    ⚠️ 复核状态见 docs/progress.md §4.1 M2.6b「口径锁定」段
  ranking_side: true             # 排序侧：7:3 加权（M2.6 已实现于 models/content_encoder/fusion.py）
                                 # ⚠️ M2.6 实测（debug 档，logs/content_fusion_eval.json）：
                                 #    后验打分融合无增益 —— val ndcg@10 纯行为 0.7878 /
                                 #    7:3 0.7874 / 5:5 0.7845 / 纯内容 0.1739；
                                 #    冷启动 holdout 7:3 0.6414 vs 5:5 0.6350。
                                 #    故 E2_3/E2_4 的"内容融合"取候选侧口径；
                                 #    排序侧保留为「冷启动在线兜底」的可选路径
  w_behavior: 0.7
  w_content: 0.3
  w_content_cold: 0.5
  cold_start_threshold: 10

# ---------- 对比基线（M2.7）----------
baselines:
  # 三个基线的**评测**入口统一是 `python scripts/run_baselines.py`。
  # 本段只放"结构超参"，不放评测口径（档位、负样本、早停一律复用主链路）。
  popularity:
    freq_source: train           # 只用训练集频次（不是 item_stats 的全量 n_positive）
                                 # ⚠️ 全量口径会混进 val/test 交互，而且让基线**更好看**，
                                 #    正好是最不容易被察觉的方向；诊断脚本另有全量口径的用途
  itemcf:
    topk_sim: 200                # 论文口径（docs/evaluation-plan.md §4）
    similarity: cosine_on_binary_cooccurrence
                                 # 二值化（用户内取重）+ 余弦归一，与 RecBole ItemKNN 一致
    tiebreak: null               # 纯 ItemCF。全零候选行的占比由脚本强制上报 ——
                                 # 那些行按本项目并列口径会**白拿 HR=1**，是必须披露的假象
  gru4rec:
    hidden_size: 64              # 与本文模型同嵌入维度（公平性要求）
    num_layers: 1                # ⚠️ 覆盖 model 段的 2：GRU4Rec 的论文口径是 1 层
    dropout: 0.2                 # 与本文模型一致
    share_item_emb: true         # 输出层复用输入嵌入（RecBole full_sort_predict 口径）

train:
  batch_size: 1024              # M2.0 实测甜点；显存占用仅 1.19 GB / 6 GB。
                                # 吞吐最优其实是 2048（再高 10%），但 batch 越大
                                # 学习率越需要重标定，故取 1024 作默认起点。
  lr: 0.001                     # ✅ M2.4 已重标定验证（2026-09-12，debug 档 8 epoch 固定预算、
                                #    seed 42、2,572 评估用户、val ndcg@10）：5e-4+wu5%→0.7842、
                                #    0.001→0.7871（最优）、0.002→0.7807、0.002+wu5%→0.7827、
                                #    0.004→0.7739。batch 1024 下经典值 0.001 仍最优，
                                #    且 5e-4 探针确认最优值不在网格边界外。
                                #    ⚠️ 组间差 ≤1.3% 接近评估噪声，此结论只回答「无需上调」；
                                #    正式的 lr 网格搜索仍按 evaluation-plan 4.2 走
  weight_decay: 0.0
  optimizer: adam
  loss: bce                     # 二元交叉熵 + 负采样
  negatives_per_position: 1     # 【训练侧】每位置负样本数，SASRec 原论文口径
                                # ⚠️ 与 eval 的 100 负样本是【两件事】，别混：
                                #    评估恒为 1 正 + 100 负（口径固定，改则指标不可比）；
                                #    训练侧实测从 1 增到 100 只慢 26%（主开销在序列编码器），
                                #    故"多采样负样本"不是提速手段，"缩短序列"才是。
  epochs: 200                   # 仅作上限；实际由 configs/scale.yaml 的 max_epochs 收紧
  early_stop_patience: 10
  early_stop_metric: ndcg@10
  grad_clip_norm: 5.0
  grad_accum_steps: 1
  num_workers: 0                # 0 = 用 models/sasrec/dataset.py 的 WindowBatchIterator
                                # （单进程批量取数，实测约 5 ms/batch，无 collate 开销）。
                                # ⚠️ 不要随手改成 >0：Windows 用 spawn 启动 worker 会把
                                # 整个序列数据集 pickle 过去，实测 4 workers 比单进程
                                # 慢 15 倍（15 个 step 从 3.6s → 55.6s）。
                                # 对比数据见 WindowBatchIterator 的 docstring。
  device: cuda
  seed: 42                      # 单次训练的默认种子；多种子由 scale.yaml 的 seeds 列表驱动
  amp: true                     # 混合精度：RTX 2060（sm_75）有 FP16 Tensor Core
  amp_dtype: fp16               # ⚠️ 必须与足够大的 batch 搭配使用：实测 bs=128/256 时
                                #    AMP 反而【变慢】（0.80x / 0.91x，kernel 启动开销
                                #    盖过收益），bs>=512 才转正，bs=1024 达 1.48x。
                                #    若出现 loss NaN / 梯度溢出再回退 fp32。

# ---------- 实测吞吐（M2.0，RTX 2060 6GB / torch 2.14.0+cu130）----------
# 重跑：python scripts/bench_throughput.py --batch-sizes 512 1024 2048 \
#          --train-negatives 1
# 数字为「纯计算」吞吐，不含 DataLoader 取数开销（该部分由 M2.3 的 Dataset 单独测）。
throughput:
  measured_at: "2026-09-12"
  raw_artifact: logs/bench_throughput.json    # 本地产物（logs/ 不入库，重跑即复现）
  train_samples_per_sec: 40083  # @ batch 2048 + AMP + 训练候选 2（1 正 1 负）
  infer_samples_per_sec: 98088  # 纯前向，评估候选 101
  best_batch_size: 2048
  recommended_batch_size: 1024  # 吞吐只低 10%，训练动态更易控制
  peak_mem_gb: 2.36             # bs2048/AMP/neg1；6GB 卡余量充足
  mfu_percent: 6.2              # 算力利用率。瓶颈是 kernel 启动与小矩阵，
                                # 不是 FLOPs —— 所以换更大 batch 才有收益，加卡同理
  amp_speedup_at_1024: 1.48
  note: |
    序列编码器（因果自注意力，O(L^2)）是主要开销，候选集大小只占小头：
    训练候选 2 / 11 / 101 → 39,344 / 32,555 / 31,171 samples/s（仅差 26%）。
    推论：想再提速应走「缩短序列/按批动态填充」，而不是缩减候选。
    batch 4096 会因显存触顶（5.46 GB）性能崩塌到 5,220 samples/s（慢 7 倍），
    不要使用。

eval:
  protocol: leave_one_out_neg100  # 1 正 + 100 负
  ks: [5, 10]
  metrics: [hr, ndcg, mrr]
  # 评估成本提醒：全量评估 = 1,306,691 用户 x 101 候选 ≈ 1.32 亿次打分，
  # 与一个训练 epoch 同量级。若每轮都做全量评估，评估时间会超过训练时间。
  every_n_epochs: 5             # 每 N 个 epoch 评估一次（最后一个 epoch 必定评估）
  user_ratio: null              # null = 取 configs/scale.yaml 中该档位的 eval_user_ratio；
                                # 同一档位内评估子集固定不变，保证跨 epoch 指标可比
  # 分题材与冷启动由 scripts/run_experiments.py 单独触发

checkpoint:
  save_dir: ./data/checkpoints
  save_best_only: true
  monitor: ndcg@10
  mode: max

logging:
  log_every_n_steps: 50
  log_capsule_similarity: true   # 记录胶囊两两余弦相似度（检测塌缩）
  tensorboard: false
