# =============================================================
# 实验分组配置 —— configs/experiment.yaml
# 用法：python scripts/run_experiments.py --config configs/experiment.yaml --all
# 设计依据：docs/evaluation-plan.md 第 6 节、docs/ablation-study.md 第 2 节
#
# ⚠️ 本文件【不写训练规模】。每个实验组用哪个档位由下面的 scale 字段指定，
#    档位定义（user_ratio / seeds / max_epochs / 评估频率）见 configs/scale.yaml。
#    原因：本机为 RTX 2060 6GB、纯本地无云算力。按原始全量设计，训练次数约 230 次，
#    早期按 RTX 3090 估算是「年」量级，毕设无法完成。
#    分档 + 结果复用 + AMP 后压到约 26 次训练；M2.0 实测（bs2048+AMP）后，
#    整个矩阵保守口径（跑满 max_epochs）约 1.66 天。
#    ⚠️ M2.4 端到端复测后修正为约 **2.2 天**（39 ms/step，比纯计算慢 35%）——
#    差额是取数、训练侧负采样与 CPU↔GPU 搬运，明细见 configs/scale.yaml 头部。
# =============================================================

output_dir: ./experiments

# 随机种子：默认由 configs/scale.yaml 的档位提供，null 表示"不覆盖档位设置"。
# 策略：只有最终模型（main 档）跑 3 个种子并报均值±标准差，
#       基线与消融组单种子 —— 种子数是对结论影响最小、最省时间的取舍项。
seeds: null
report_mean_std: true

# ---------- 基线配置：所有实验组共享，禁止随意改动 ----------
base:
  max_seq_len: 50
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  batch_size: 1024         # M2.0 实测甜点；增幅见 configs/model.yaml 的 throughput 段
  lr: 0.001
  epochs: 200              # 仅作上限，实际由档位的 max_epochs 收紧
  early_stop_patience: 10
  neg_sample_num: 100      # 【评估】1 正 + 100 负；改动会使全部指标不可比
  train_negatives_per_position: 1   # 【训练】每位置负样本数，SASRec 原论文口径。
                           # 与上面的 100 是【两件事】，不要混（详见 model.yaml 的 train 段）
  amp: true                # 混合精度；⚠️ 仅在 batch>=512 时才有收益

# ---------- E1 整体效果对比 ----------
E1_overall:
  scale: main              # 论文正文的正式数字：10% 用户 + 3 种子（2026-09-12 定稿）
  models:
    # ⚠️【必须有】热度基线：本数据集在 1 正 + 100 均匀负采样下，一个完全不知道
    # 用户是谁、只看物品全局热度的打分器就能拿到 hr@10 = 0.866 / ndcg@10 = 0.607
    # （smoke 档实测），而模型是 0.920 / 0.716 —— 只高 6% / 18%。
    # 成因：正样本必然是"用户交互过且交互数≥10"的物品（天然偏热门），
    # 负样本从全池均匀抽（全池中位热度仅 288）。实测正/负热度均值差 24.7 倍。
    # 不报这一行，等于把"热度先验"的功劳算给了序列建模。
    # 证据与复现：scripts/diagnose_popularity_bias.py
    # 实现：M2.7（与 itemcf/gru4rec 一起做，无需训练，秒级出结果）
    - { name: popularity, impl: models/baselines/popularity.py, params: { freq_from: train } }
    - { name: itemcf,  impl: models/baselines/itemcf.py,  params: { topk_sim: 200 } }
    - { name: gru4rec, impl: models/baselines/gru4rec.py, params: { hidden_size: 64, num_layers: 1 } }
    - { name: sasrec,  impl: models/sasrec/model.py,      params: { use_multi_interest: false, use_content_fusion: false } }
    - { name: ours,    impl: models/multi_interest/model.py, params: { use_multi_interest: true, use_content_fusion: true } }
  test_set: full
  metrics: [hr@5, hr@10, ndcg@5, ndcg@10, mrr]
  note: popularity 无需训练、itemcf 无需训练；三个神经模型 x 3 种子 = 9 次训练

# ---------- E2 消融实验 ----------
E2_ablation:
  scale: dev               # 先在开发档定结论，最终确认时用 E1 的 main 档结果复核
  groups:
    # 2026-09-12 更新：组开关从早期占位的 use_multi_interest/use_content_fusion
    # 改为已落地的 arch 开关（scripts/train.py --model）。content_fusion 属
    # M2.6，落地前 E2_3/E2_4 无法跑，先跑 E2_1 / E2_2。
    E2_1_pure_sasrec:      { arch: sasrec }                     # 复用 E1 sasrec，无需新训练
    E2_2_multi_interest:   { arch: multi_interest, num_interests: 4 }   # M2.5
    E2_3_content_fusion:   { arch: sasrec,          w_behavior: 0.7, w_content: 0.3 }   # 待 M2.6
    E2_4_full:             { arch: multi_interest,  num_interests: 4, w_behavior: 0.7, w_content: 0.3 }  # 待 M2.6
  test_set: full
  metrics: [hr@5, hr@10, ndcg@5, ndcg@10]
  report_params: true          # 报告参数量，证明增益不来自参数增长
  # 复用规则（省训练次数的关键）：
  #   E2_1 pure_sasrec 直接复用 E1 的 sasrec
  #   E2_4 full        直接复用 E1 的 ours
  # 于是只有 E2_2 / E2_3 需要新训练 => 2 组 x 1 种子 = 2 次
  reuse_from:
    E2_1_pure_sasrec: E1_overall.sasrec
    E2_4_full:        E1_overall.ours

# ---------- E3 冷启动专项 ----------
E3_coldstart:
  scale: dev
  models:
    - { name: pure_sasrec,  cfg: { use_multi_interest: false, use_content_fusion: false } }
    - { name: ours_w03,     cfg: { use_multi_interest: true,  use_content_fusion: true, w_content_cold: 0.3 } }
    - { name: ours_w05,     cfg: { use_multi_interest: true,  use_content_fusion: true, w_content_cold: 0.5 } }
  test_set: cold_start_subset   # 正样本交互数 < 10
  metrics: [hr@10, ndcg@10]
  require_absent_in_train: true # 训练集必须不可见，否则实验无效
  reuse_from:
    pure_sasrec: E2_ablation.E2_1_pure_sasrec

# ---------- E4 分题材指标 ----------
E4_by_genre:
  reuse: E2_ablation            # 复用消融训练结果，不重新训练
  test_set: full
  group_by: primary_genre
  metrics: [recall@10]
  highlight_genres: [8, 12, 5, 11]   # 小众题材：运动/后宫/悬疑/音乐
  min_scale_ratio: 0.20         # ⚠️ 本组实验不可用 dev / smoke 档：
                                #    运动竞技 743 条、后宫福利 837 条在 5% 抽样下
                                #    只剩三四十条，分题材指标不具统计意义。

# ---------- 超参搜索 ----------
HPO:
  enabled: true
  scale: smoke                 # 粗搜只在冒烟档跑，几分钟一组
  seeds: [42]                  # 粗搜单种子
  coarse_grid_size: 8          # 粗搜最多评估的组合数
                               # （原设计无上限：60 组 x 3 种子 = 180 次训练，
                               #   占全部训练次数的近八成，是本项目最大的时间黑洞）
  refine_scale: dev            # 粗搜选出的前 K 组，再到开发档细搜
  refine_top_k: 3
  params:
    hidden_size: [32, 64, 128]
    num_layers: [1, 2, 3]
    num_heads: [1, 2, 4]
    dropout: [0.1, 0.2, 0.3, 0.5]
    lr: [0.0001, 0.0005, 0.001, 0.003]
    batch_size: [512, 1024, 2048]   # 实测 bs>=512 才有吞吐优势，128/256 无收益且更慢
    num_interests: [2, 4, 6, 8]
  strategy: coarse_to_fine       # 先粗网格定范围，再细搜

# ---------- 补充实验 ----------
extra:
  scale: dev
  k_sensitivity:                 # 兴趣数敏感性
    num_interests: [2, 4, 6, 8]
    metrics: [ndcg@10, recall@10]
  fusion_weight_sensitivity:     # 内容融合权重敏感性
    w_content: [0.0, 0.1, 0.3, 0.5, 0.7, 1.0]
    metrics: [ndcg@10]
  capsule_collapse_check:        # 胶囊塌缩检测
    enabled: true
    similarity_warn_threshold: 0.7
