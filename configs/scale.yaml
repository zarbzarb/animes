# =============================================================
# 训练档位配置 —— configs/scale.yaml
#
# 作用：把「训练规模」与「模型结构 / 训练超参」解耦。
#       model.yaml 和 experiment.yaml 不再写规模，规模只在本文件里改，
#       避免同一件事有两个事实源。
#
# 用法：python scripts/train.py --config configs/model.yaml --scale dev
#
# -------------------------------------------------------------
# 为什么要分档（背景，勿删）
# -------------------------------------------------------------
# 本机为 RTX 2060 6GB，纯本地无云算力。阶段一实测每 epoch 全量训练样本
# 【109,081,471】（约 1.09 亿，均值 83.5 / 用户）。而完整的实验矩阵为：
#     E1 4 模型 + E2 4 组 + E3 3 模型 + HPO 60 组 + 补充 10 组
#     再乘 3 个随机种子 ≈ 230 次训练
# 即便单次训练只需 1 小时，总量级也是「年」，毕设无法完成。
# 故采用「小档调通 → 中档调参 → 大档出主表 → 有余力再上全量」策略。
#
# -------------------------------------------------------------
# 抽样口径（三条，必须写进论文的「实验设置」小节）
# -------------------------------------------------------------
# 1. 【只抽用户，不抽物品】
#    物品池恒为全量 15,687。这样模型结构与输出层维度在所有档位完全一致，
#    大档可以直接复用小档选出的超参，不需要按档位重新调参。
#    代价：抽样后低频物品的正样本更少，故【分题材实验 E4 不建议用 5% 以下档位】
#    （运动竞技 743 条、后宫福利 837 条在 5% 下只剩三四十条，不具统计意义）。
#
# 2. 【抽样是确定性且严格嵌套的】
#    0.5% ⊂ 2% ⊂ 5% ⊂ 10% ⊂ 100%。实现见 models/data/user_subset.py
#    （基于 user_id 稳定哈希排序后取前缀），因此换档位只是「放大验证」，
#    不是「换一套数据重做」—— 小档调出的超参可以直接拿到大档使用。
#
# 3. 【评估子集从本档位用户中抽取，且同档位内固定不变】
#    评估用户数 = 本档位用户数 × eval_user_ratio（注意：**不是**相对全量用户池）。
#    留一法协议下每个用户的测试物品已被剥离，因此在训练过的用户上评估是标准做法，
#    不构成信息泄漏（这一点常被误解，论文里可以顺带澄清）。
#    同一档位内跨 epoch 必须使用**完全相同**的评估子集，否则不同 epoch 的指标不可比，
#    best model 会被选错。跨档位允许不同，各档只对自己负责。
#    ⚠️ 同一组对比实验内部所有模型必须共用同一个评估子集，基线不许另抽一套。
#
# ⚠️ 本文件里所有 max_epochs / user_ratio 的具体数值是【量级估算】，
#    待 M2.0 用 scripts/bench_throughput.py 实测吞吐后按真实耗时校准。
#    校准前不要把它写进论文的硬件与耗时描述。
# =============================================================

default_scale: dev

scales:

  # ---------- 冒烟档：只验证「代码不崩」 ----------
  smoke:
    user_ratio: 0.005            # 0.5%  ≈ 6,533 用户
    seeds: [42]
    max_epochs: 3
    eval_every_n_epochs: 1
    eval_user_ratio: 0.10        # ≈ 653 用户
    purpose: 改完代码先跑这个，几分钟出结果，确认数据管道与训练循环没断

  # ---------- 调试档：看趋势、抓 bug ----------
  debug:
    user_ratio: 0.02             # 2%    ≈ 26,134 用户
    seeds: [42]
    max_epochs: 30
    eval_every_n_epochs: 3
    eval_user_ratio: 0.10        # ≈ 2,613 用户
    purpose: 判断改动方向对不对（指标涨了还是跌了），不看绝对值

  # ---------- 开发档：HPO 与消融的主战场 ----------
  dev:
    user_ratio: 0.05             # 5%    ≈ 65,335 用户
    seeds: [42]
    max_epochs: 30
    eval_every_n_epochs: 5
    eval_user_ratio: 0.20        # ≈ 13,067 用户；2 万量级的评估集对 HR@10 足够稳（SE≈0.3%）
    purpose: HPO 细搜、消融实验、基线对比。单种子

  # ---------- 主表档：论文正文的正式数字 ----------
  main:
    user_ratio: 0.10             # 10%   ≈ 130,669 用户
    seeds: [42, 2024, 2025]      # 唯一跑多种子的档位，报均值±标准差
    max_epochs: 30
    eval_every_n_epochs: 5
    eval_user_ratio: 1.0         # 正式数字用本档位【全部】用户评估，不做子采样
    purpose: E1 主对比 + E2 消融的正式结果
    # 若 M2.0 实测吞吐明显好于预期，可把 user_ratio 提到 0.20 并把
    # 基线的 seeds 收敛为 [42]（只让最终模型跑 3 种子），再做一次正式跑。

  # ---------- 全量档：有余力才跑 ----------
  full:
    user_ratio: 1.0              # 1,306,691 用户
    seeds: [42]
    max_epochs: 30
    eval_every_n_epochs: 5
    eval_user_ratio: 0.20        # ≈ 261,338 用户；全量评估太贵，采样 20% 出附录数字
    purpose: 附录的「全量规模验证」，证明抽样结论可外推；时间不够可放弃

# ---------- 跨档位必须成立的不变式（改档位时不得破坏） ----------
invariants:
  sample_users_not_items: true            # 只抽用户，物品池恒为全量
  nested_sampling: true                   # 各档位用户集必须严格嵌套
  eval_subset_fixed_within_scale: true    # 同档位内评估子集固定不变
  hpo_scale: smoke                        # HPO 粗搜只在冒烟档跑
  hpo_top_k_to_dev: 3                     # 粗搜选前 3 组，再到 dev 档细搜
  final_model_seeds: 3                    # 最终模型报 3 种子均值±标准差
